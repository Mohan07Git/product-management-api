openapi: 3.1.0
info:
  title: Product Management API
  version: 1.0.0
  description: |
    RESTful API for managing product catalog data with CRUD operations,
    filtering, search, soft-archive (delete/restore), and SKU-based lookups.
  contact:
    name: Product Management API Team
servers:
  - url: http://localhost:3000
    description: Development server

paths:
  /products:
    get:
      summary: List all non-archived products with optional filters
      operationId: getAllProducts
      tags:
        - Products
      parameters:
        - $ref: '#/components/parameters/CategoryQuery'
        - $ref: '#/components/parameters/StatusQuery'
        - $ref: '#/components/parameters/MinPriceQuery'
        - $ref: '#/components/parameters/MaxPriceQuery'
        - $ref: '#/components/parameters/InStockQuery'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: Successful response with array of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a new product
      operationId: createProduct
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Validation error (missing/invalid required fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - SKU already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable entity - validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/bulk:
    post:
      summary: Create multiple products in one request
      operationId: bulkCreateProducts
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Products created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          description: Validation error (missing/invalid required fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - one or more SKUs already exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable entity - validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{id}:
    get:
      summary: Get a single product by UUID
      operationId: getProductById
      tags:
        - Products
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Product not found or archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: Partially update a product
      operationId: updateProduct
      tags:
        - Products
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPatch'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Validation error (invalid fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found or archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - SKU already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable entity - validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Soft-archive a product (sets archivedAt)
      operationId: archiveProduct
      tags:
        - Products
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      responses:
        '200':
          description: Product archived successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Product not found or already archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{id}/restore:
    delete:
      summary: Restore a soft-archived product (clears archivedAt)
      operationId: restoreProduct
      tags:
        - Products
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      responses:
        '200':
          description: Product restored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Product not found or not archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    ProductIdPath:
      name: id
      in: path
      required: true
      description: Product UUID (v4)
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        example: '123e4567-e89b-42d3-a456-426614174000'

    CategoryQuery:
      name: category
      in: query
      description: Filter by exact category match
      schema:
        type: string
        enum: [electronics, clothing, food, books, other]
      example: electronics

    StatusQuery:
      name: status
      in: query
      description: Filter by exact status match
      schema:
        type: string
        enum: [active, inactive, discontinued]
      example: active

    MinPriceQuery:
      name: minPrice
      in: query
      description: Minimum price (inclusive)
      schema:
        type: number
        format: float
        minimum: 0
      example: 50

    MaxPriceQuery:
      name: maxPrice
      in: query
      description: Maximum price (inclusive)
      schema:
        type: number
        format: float
        minimum: 0
      example: 500

    InStockQuery:
      name: inStock
      in: query
      description: Filter by stock availability (passed as string 'true' or 'false')
      schema:
        type: string
        enum: ['true', 'false']
      example: 'true'

    SearchQuery:
      name: search
      in: query
      description: Case-insensitive substring match on name or description
      schema:
        type: string
        minLength: 1
        maxLength: 100
      example: wireless

  schemas:
    # --- Envelope schemas ---
    ApiEnvelope:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Indicates whether the request succeeded
        data:
          description: Response payload (present on success)
        error:
          description: Error message or details (present on failure)

    ProductResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required:
            - data
          properties:
            success:
              type: boolean
              enum: [true]
            data:
              $ref: '#/components/schemas/Product'

    ProductListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required:
            - data
          properties:
            success:
              type: boolean
              enum: [true]
            data:
              type: array
              items:
                $ref: '#/components/schemas/Product'

    MessageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required:
            - data
          properties:
            success:
              type: boolean
              enum: [true]
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: 'Product archived successfully'

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required:
            - error
          properties:
            success:
              type: boolean
              enum: [false]
            error:
              oneOf:
                - type: string
                  example: 'Product not found'
                - type: array
                  items:
                    type: string
                  example: ['name is required', 'sku must be unique']

    # --- Product schemas ---
    Product:
      type: object
      required:
        - id
        - name
        - sku
        - description
        - category
        - price
        - stock
        - status
        - createdAt
        - archivedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier (UUID v4, server-generated)
          readOnly: true
          example: '123e4567-e89b-42d3-a456-426614174000'
        name:
          type: string
          description: Product name (trimmed, 1-255 chars)
          minLength: 1
          maxLength: 255
          example: 'Wireless Headphones'
        sku:
          type: string
          description: Stock Keeping Unit — must be unique (trimmed, 1-64 chars)
          minLength: 1
          maxLength: 64
          example: 'WH-1000'
        description:
          type: string
          description: Product description (trimmed, empty string if not provided)
          example: 'Noise-cancelling over-ear headphones'
        category:
          type: string
          enum: [electronics, clothing, food, books, other]
          description: Product category (defaults to 'other')
          example: electronics
        price:
          type: number
          format: float
          description: Positive price with max 2 decimal places
          minimum: 0.01
          multipleOf: 0.01
          example: 199.99
        stock:
          type: integer
          description: Current stock level (non-negative integer)
          minimum: 0
          example: 50
        status:
          type: string
          enum: [active, inactive, discontinued]
          description: Product status (defaults to 'active')
          example: active
        createdAt:
          type: string
          format: date-time
          description: Timestamp when product was created (ISO 8601)
          readOnly: true
          example: '2026-01-15T10:30:00.000Z'
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when product was soft-archived (null if active)
          readOnly: true
          example: '2026-01-20T14:45:00.000Z'

    ProductInput:
      type: object
      required:
        - name
        - sku
        - price
      properties:
        name:
          type: string
          description: Product name (required, trimmed, 1-255 chars)
          minLength: 1
          maxLength: 255
          example: 'Wireless Headphones'
        sku:
          type: string
          description: Stock Keeping Unit (required, unique, trimmed, 1-64 chars)
          minLength: 1
          maxLength: 64
          example: 'WH-1000'
        description:
          type: string
          description: Optional product description (trimmed)
          maxLength: 2000
          example: 'Noise-cancelling over-ear headphones'
        category:
          type: string
          enum: [electronics, clothing, food, books, other]
          description: Product category (defaults to 'other')
          example: electronics
        price:
          type: number
          format: float
          description: Positive price with max 2 decimal places (required)
          minimum: 0.01
          multipleOf: 0.01
          example: 199.99
        stock:
          type: integer
          description: Initial stock level (non-negative integer, defaults to 0)
          minimum: 0
          default: 0
          example: 50
        status:
          type: string
          enum: [active, inactive, discontinued]
          description: Product status (defaults to 'active')
          default: active
          example: active

    ProductPatch:
      type: object
      properties:
        name:
          type: string
          description: Product name (trimmed, 1-255 chars)
          minLength: 1
          maxLength: 255
          example: 'Wireless Headphones Pro'
        sku:
          type: string
          description: Stock Keeping Unit (trimmed, must be unique if changed, 1-64 chars)
          minLength: 1
          maxLength: 64
          example: 'WH-1000-PRO'
        description:
          type: string
          description: Product description (trimmed)
          maxLength: 2000
          example: 'Updated description'
        category:
          type: string
          enum: [electronics, clothing, food, books, other]
          description: Product category
          example: electronics
        price:
          type: number
          format: float
          description: Positive price with max 2 decimal places
          minimum: 0.01
          multipleOf: 0.01
          example: 179.99
        stock:
          type: integer
          description: Stock level (non-negative integer)
          minimum: 0
          example: 45
        status:
          type: string
          enum: [active, inactive, discontinued]
          description: Product status
          example: active

tags:
  - name: Products
    description: Product catalog management endpoints